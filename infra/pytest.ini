[pytest]
testpaths = tests
# The sibling source roots too: the graph tests import the tools, the decision engine and the
# account platform to check they agree with the state machines. Not a conftest — infra/tests and
# tools/tests are both packages named `tests`, so a second `tests.conftest` collides with the
# first when the whole suite runs from the repository root.
pythonpath = . ../tools ../decision-engine ../account-stub ../audit ../review ../api ../harnesses
addopts = -q --tb=short
