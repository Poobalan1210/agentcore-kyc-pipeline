[pytest]
# CDK synth output is excluded from collection deliberately. Deploys here must use a distinct
# --output directory per stack (concurrent runs otherwise fail with "Other CLIs (PID=...) are
# currently reading from cdk.out"), so cdk.out.* accumulates. Each one contains a *copy* of the
# Lambda asset source, including its tests, which pytest would collect as duplicate modules with
# clashing basenames — 15 collection errors that look like real failures but are stale copies.
norecursedirs = .venv cdk.out cdk.out.* node_modules .git

testpaths = infra/tests tools/tests account-stub decision-engine audit review policies/tests api/tests demo-assets/tests

# Each suite previously ran from inside its own directory, so imports resolved by cwd. Running
# them together needs those roots on the path explicitly.
#
# NAMING RULE for shared test helpers: give them a suite-unique module name — `engine_builders.py`,
# `audit_builders.py` — never a bare `builders.py`. Each suite's conftest inserts its own directory
# at sys.path[0], so two helpers with the same basename resolve by collection order and the suite
# that sorts later silently imports the wrong module. This has already cost one debugging cycle.
pythonpath = infra tools account-stub decision-engine audit review policies api

# infra/tests/ and tools/tests/ are BOTH packages named "tests" (each has __init__.py), so under
# the default prepend mode whichever path comes first wins and the other's modules resolve to
# "tests.<name>" in the wrong package. importlib mode keys modules by full path, so both collect.
addopts = --import-mode=importlib
